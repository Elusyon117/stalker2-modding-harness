<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The zonecraft dashboard: a mod's page with its build, test copy, plan and Blueprint pastes, and Clawd at his campfire</title><defs><linearGradient id="zc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1c1a"/><stop offset="1" stop-color="#141312"/></linearGradient><radialGradient id="zc-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8772e" stop-opacity="0.16"/><stop offset="1" stop-color="#e8772e" stop-opacity="0"/></radialGradient><linearGradient id="zc-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141312" stop-opacity="0"/><stop offset="1" stop-color="#141312"/></linearGradient><filter id="zc-shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter><clipPath id="zc-clip"><rect width="880" height="500" rx="16"/></clipPath></defs><g clip-path="url(#zc-clip)"><rect width="880" height="500" fill="url(#zc-bg)"/><rect x="48" y="48" width="137" height="26" rx="13" fill="#e8772e" fill-opacity="0.12" stroke="#e8772e" stroke-opacity="0.5"/><text x="117" y="61" font-size="12.5" fill="#e8772e" font-family="Consolas, Menlo, monospace" text-anchor="middle" dominant-baseline="central">/zonecraft-panel</text><text x="48" y="118" font-size="30" font-weight="700" fill="#ececea">Dashboard</text><text x="48" y="152" font-size="15" fill="#a3a29c">Every mod you work on, and where each one</text><text x="48" y="174" font-size="15" fill="#a3a29c">stands.</text><text x="48" y="216" font-size="14" fill="#e8772e" font-weight="700">›</text><text x="66" y="216" font-size="13.5" fill="#ececea">All mods: packaging, build, test copy,</text><text x="66" y="236" font-size="13.5" fill="#ececea">features and conflicts for each mod</text><text x="48" y="266" font-size="14" fill="#e8772e" font-weight="700">›</text><text x="66" y="266" font-size="13.5" fill="#ececea">Each mod's page: the last cook, the test</text><text x="66" y="286" font-size="13.5" fill="#ececea">copy in your game, checkpoints</text><text x="48" y="316" font-size="14" fill="#e8772e" font-weight="700">›</text><text x="66" y="316" font-size="13.5" fill="#ececea">The plan, ticked off as each feature works</text><text x="66" y="336" font-size="13.5" fill="#ececea">in game</text><ellipse cx="643.0" cy="250.0" rx="310.5" ry="300.0" fill="url(#zc-glow)"/><g transform="translate(443.0 34) scale(1.000)" filter="url(#zc-shadow)"><svg xmlns="http://www.w3.org/2000/svg" width="400" height="632" viewBox="0 0 400 632" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The zonecraft dashboard: the tracked mod, its build and test copy, the plan's features, Blueprint pastes with a Copy button, and Clawd at his campfire</title><rect width="400" height="632" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="399" height="631" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="27" font-size="13" font-weight="600" fill="#ececea">zonecraft</text><path d="M373 18 l8 8 M381 18 l-8 8" stroke="#6f6e69" stroke-width="1.4"/><text x="18" y="61" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MOD</text><rect x="18" y="72" width="116" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="76.0" y="86" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">‹ All mods (3)</text><text x="18" y="125" font-size="15" fill="#ececea" font-weight="600">ImmersiveCampfires<tspan fill="#a3a29c" font-weight="400" font-size="13"> · IC</tspan></text><text x="18" y="144" font-size="13" fill="#ececea" font-weight="400">Sit down at any campfire: the camera lowers, time</text><text x="18" y="162" font-size="13" fill="#ececea" font-weight="400">passes faster and you heal slowly.</text><text x="18" y="180" font-size="12" fill="#a3a29c" font-weight="400">2026-11-09: seated pose and camera confirmed in game.</text><text x="18" y="203" font-size="13" fill="#4ade80">✓</text><text x="34" y="203" font-size="13" fill="#a3a29c">Zone Kit</text><text x="124" y="203" font-size="13" fill="#ececea">set up</text><text x="18" y="224" font-size="13" fill="#4ade80">✓</text><text x="34" y="224" font-size="13" fill="#a3a29c">Last cook</text><text x="124" y="224" font-size="13" fill="#ececea">12 min ago</text><text x="18" y="245" font-size="13" fill="#c2410c">!</text><text x="34" y="245" font-size="13" fill="#a3a29c">Test copy</text><text x="124" y="245" font-size="13" fill="#ececea">installed 2 h ago (older than the last cook)</text><text x="18" y="266" font-size="13" fill="#6f6e69">·</text><text x="34" y="266" font-size="13" fill="#a3a29c">Checkpoints</text><text x="124" y="266" font-size="13" fill="#ececea">3 (last: build3)</text><text x="18" y="299" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">PLAN</text><text x="18" y="319" font-size="13" fill="#6f6e69">·</text><text x="34" y="319" font-size="13" fill="#a3a29c">Features</text><text x="124" y="319" font-size="13" fill="#ececea">2 of 4 done</text><text x="34" y="340" font-size="13" fill="#4ade80">✓</text><text x="50" y="340" font-size="13" fill="#a3a29c">Sit with a key near a fire</text><text x="34" y="361" font-size="13" fill="#4ade80">✓</text><text x="50" y="361" font-size="13" fill="#a3a29c">Camera lowers while seated</text><text x="34" y="382" font-size="13" fill="#e8772e">○</text><text x="50" y="382" font-size="13" fill="#ececea">Time passes faster while sitting</text><text x="34" y="403" font-size="13" fill="#e8772e">○</text><text x="50" y="403" font-size="13" fill="#ececea">Slow healing by the fire</text><text x="18" y="424" font-size="13" fill="#6f6e69">·</text><text x="34" y="424" font-size="13" fill="#a3a29c">To check</text><text x="124" y="424" font-size="13" fill="#ececea">1 open</text><text x="34" y="445" font-size="13" fill="#6f6e69">-</text><text x="50" y="445" font-size="13" fill="#a3a29c">Works alongside other popular mods</text><text x="18" y="478" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">BLUEPRINT PASTES</text><rect x="18" y="485" width="50" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="43.0" y="499" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Copy</text><text x="78" y="499" font-size="13" font-weight="600" fill="#ececea" dominant-baseline="central">seated_legs <tspan font-weight="400" fill="#a3a29c" font-size="12">7 nodes · just now</tspan></text><text x="34" y="532" font-size="13" fill="#4ade80">✓</text><text x="50" y="532" font-size="13" fill="#a3a29c">check: 7 nodes, 6 links, no problems</text><text x="18" y="552" font-size="12" fill="#a3a29c" font-weight="400">Copy, click into the Blueprint graph in the Zone Kit, press</text><text x="18" y="570" font-size="12" fill="#a3a29c" font-weight="400">Ctrl+V, then Compile and Save.</text><rect x="18" y="586" width="70" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="53.0" y="600" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Refresh</text><g transform="translate(292 44) scale(2)" shape-rendering="crispEdges"><rect x="6" y="0" width="16" height="1" fill="#d97757"/><rect x="6" y="1" width="1" height="1" fill="#d97757"/><rect x="7" y="1" width="6" height="1" fill="#5b5850"/><rect x="13" y="1" width="2" height="1" fill="#2b2a27"/><rect x="15" y="1" width="6" height="1" fill="#5b5850"/><rect x="21" y="1" width="1" height="1" fill="#d97757"/><rect x="6" y="2" width="1" height="1" fill="#d97757"/><rect x="7" y="2" width="1" height="1" fill="#5b5850"/><rect x="8" y="2" width="1" height="1" fill="#faf9f5"/><rect x="9" y="2" width="3" height="1" fill="#d4dc6a"/><rect x="12" y="2" width="1" height="1" fill="#5b5850"/><rect x="13" y="2" width="2