<svg xmlns="http://www.w3.org/2000/svg" width="640" height="356" viewBox="0 0 640 356" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The Build and test band above the prompt: a packaging in progress with its stage and time, then the finished build with Install test copy and What to test</title><rect width="640" height="356" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="639" height="355" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="28" font-size="11" fill="#6f6e69" letter-spacing="0.8">WHILE PACKAGING</text><text x="18" y="54" font-size="13"><tspan fill="#e8772e">●</tspan><tspan fill="#ececea" font-weight="600" dx="8">Packaging ImmersiveCampfires</tspan><tspan fill="#ececea" dx="8">Cooking</tspan><tspan fill="#a3a29c" dx="8">3:12 · 64% · close the game before installing</tspan></text><text x="18" y="74" font-size="12" fill="#a3a29c">LogCook: Display: Cooked packages 1840 Packages Remain 1032 Total 2872</text><rect x="18" y="88" width="604" height="38" rx="10" fill="#262624" stroke="#4a4944"/><text x="32" y="107" font-size="13" fill="#6f6e69" dominant-baseline="central">Reply to Claude…</text><text x="18" y="166" font-size="11" fill="#6f6e69" letter-spacing="0.8">AFTER A GOOD BUILD</text><text x="18" y="192" font-size="13"><tspan fill="#4ade80">✓</tspan><tspan fill="#ececea" font-weight="600" dx="8">Packaged ImmersiveCampfires in 5:42</tspan><tspan fill="#a3a29c" dx="8">just now</tspan></text><text x="18" y="219" font-size="12" fill="#a3a29c">Release candidate: 6 files just now</text><rect x="232" y="202" width="136" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="300.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Install test copy</text><rect x="374" y="202" width="90" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="419.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Hide tests</text><rect x="470" y="202" width="50" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="495.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Hide</text><text x="34" y="250" font-size="12" fill="#a3a29c">Try each in game, then press what happened:</text><text x="34" y="276" font-size="13"><tspan fill="#e8772e">○</tspan><tspan fill="#ececea" dx="8">Time passes faster while sitting</tspan></text><rect x="288" y="260" width="63" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="319.5" y="273" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Worked</text><rect x="357" y="260" width="63" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="388.5" y="273" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Didn't</text><rect x="18" y="304" width="604" height="38" rx="10" fill="#262624" stroke="#4a4944"/><text x="32" y="323" font-size="13" fill="#6f6e69" dominant-baseline="central">Reply to Claude…</text></svg>