<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The Build and test band above the prompt: a packaging in progress with its stage and time, then the finished build with Install test copy and the features to try</title><defs><linearGradient id="zc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1c1a"/><stop offset="1" stop-color="#141312"/></linearGradient><radialGradient id="zc-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8772e" stop-opacity="0.16"/><stop offset="1" stop-color="#e8772e" stop-opacity="0"/></radialGradient><linearGradient id="zc-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141312" stop-opacity="0"/><stop offset="1" stop-color="#141312"/></linearGradient><filter id="zc-shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter><clipPath id="zc-clip"><rect width="880" height="500" rx="16"/></clipPath></defs><g clip-path="url(#zc-clip)"><rect width="880" height="500" fill="url(#zc-bg)"/><rect x="48" y="40" width="137" height="26" rx="13" fill="#e8772e" fill-opacity="0.12" stroke="#e8772e" stroke-opacity="0.5"/><text x="117" y="53" font-size="12.5" fill="#e8772e" font-family="Consolas, Menlo, monospace" text-anchor="middle" dominant-baseline="central">above the prompt</text><text x="48" y="106" font-size="30" font-weight="700" fill="#ececea">Build &amp; test</text><text x="48" y="138" font-size="15" fill="#a3a29c">While you press Package Mod in the Zone Kit, the band above the prompt follows it: stage, time</text><text x="48" y="160" font-size="15" fill="#a3a29c">and errors, then Install test copy and what to try in game.</text><ellipse cx="440.0" cy="380" rx="440.0" ry="225.0" fill="url(#zc-glow)"/><g transform="translate(179.3 180.0) scale(0.815)" filter="url(#zc-shadow)"><svg xmlns="http://www.w3.org/2000/svg" width="640" height="356" viewBox="0 0 640 356" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The Build and test band above the prompt: a packaging in progress with its stage and time, then the finished build with Install test copy and What to test</title><rect width="640" height="356" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="639" height="355" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="28" font-size="11" fill="#6f6e69" letter-spacing="0.8">WHILE PACKAGING</text><text x="18" y="54" font-size="13"><tspan fill="#e8772e">●</tspan><tspan fill="#ececea" font-weight="600" dx="8">Packaging ImmersiveCampfires</tspan><tspan fill="#ececea" dx="8">Cooking</tspan><tspan fill="#a3a29c" dx="8">3:12 · 64% · close the game before installing</tspan></text><text x="18" y="74" font-size="12" fill="#a3a29c">LogCook: Display: Cooked packages 1840 Packages Remain 1032 Total 2872</text><rect x="18" y="88" width="604" height="38" rx="10" fill="#262624" stroke="#4a4944"/><text x="32" y="107" font-size="13" fill="#6f6e69" dominant-baseline="central">Reply to Claude…</text><text x="18" y="166" font-size="11" fill="#6f6e69" letter-spacing="0.8">AFTER A GOOD BUILD</text><text x="18" y="192" font-size="13"><tspan fill="#4ade80">✓</tspan><tspan fill="#ececea" font-weight="600" dx="8">Packaged ImmersiveCampfires in 5:42</tspan><tspan fill="#a3a29c" dx="8">just now</tspan></text><text x="18" y="219" font-size="12" fill="#a3a29c">Release candidate: 6 files just now</text><rect x="232" y="202" width="136" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="300.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Install test copy</text><rect x="374" y="202" width="90" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="419.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Hide tests</text><rect x="470" y="202" width="50" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="495.0" y="215" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Hide</text><text x="34" y="250" font-size="12" fill="#a3a29c">Try each in game, then press what happened:</text><text x="34" y="276" font-size="13"><tspan fill="#e8772e">○</tspan><tspan fill="#ececea" dx="8">Time passes faster while sitting</tspan></text><rect x="288" y="260" width="63" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="319.5" y="273" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Worked</text><rect x="357" y="260" width="63" height="26" rx="6" fill="#262624" stroke="#4a4944"/><text x="388.5" y="273" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Didn't</text><rect x="18" y="304" width="604" height="38" rx="10" fill="#262624" stroke="#4a4944"/><text x="32" y="323" font-size="13" fill="#6f6e69" dominant-baseline="central">Reply to Claude…</text></svg></g></g><rect x="0.5" y="0.5" width="879" height="499" rx="16" fill="none" stroke="#3d3c38"/></svg>