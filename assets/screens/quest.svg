<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1800" viewBox="0 0 400 1800" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The Quest designer: a mod picked at the top, the quest's basics, start and place, characters, ordered stages with markers, rewards, branches and rules with suggestions, and Send to Claude</title><rect width="400" height="1800" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="399" height="1799" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="27" font-size="13" font-weight="600" fill="#ececea">Quest designer</text><path d="M373 18 l8 8 M381 18 l-8 8" stroke="#6f6e69" stroke-width="1.4"/><text x="18" y="61" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">QUEST DESIGNER</text><text x="18" y="80" font-size="12" fill="#a3a29c" font-weight="400">Lay out the quest; Claude turns it into a Quest Blueprint</text><text x="18" y="98" font-size="12" fill="#a3a29c" font-weight="400">plan and walks you through the Quest Tool.</text><text x="18" y="129" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MOD</text><text x="18" y="148" font-size="12" fill="#a3a29c" font-weight="400">The quest belongs to this mod: its files, PLAN.md and texts.</text><text x="18" y="170" font-size="12" fill="#a3a29c" dominant-baseline="central">Mod</text><rect x="122" y="154" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="170" font-size="12" fill="#ececea" dominant-baseline="central">ImmersiveCampfires (this folder)</text><path d="M364 168 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="206" font-size="12" fill="#a3a29c" dominant-baseline="central">Saved:</text><rect x="64" y="192" width="136" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="132.0" y="206" font-size="12" fill="#ececea" font-weight="400" text-anchor="middle" dominant-baseline="central">IC_ASeatByTheFire</text><text x="18" y="245" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">QUEST</text><text x="18" y="268" font-size="12" fill="#a3a29c" dominant-baseline="central">Title</text><rect x="122" y="252" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="268" font-size="12" fill="#ececea" dominant-baseline="central">A Seat by the Fire</text><text x="18" y="306" font-size="12" fill="#a3a29c" dominant-baseline="central">SID</text><rect x="122" y="290" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="306" font-size="12" fill="#6f6e69" dominant-baseline="central">IC_ASeatByTheFire</text><text x="18" y="344" font-size="12" fill="#a3a29c" dominant-baseline="central">Kind</text><rect x="122" y="328" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="344" font-size="12" fill="#ececea" dominant-baseline="central">Side quest</text><path d="M364 342 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="382" font-size="12" fill="#a3a29c" dominant-baseline="central">Summary</text><rect x="122" y="366" width="260" height="52" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="382" font-size="12" fill="#ececea" dominant-baseline="central">An old stalker at the camp wants someone</text><text x="132" y="402" font-size="12" fill="#ececea" dominant-baseline="central">to sit and hear his last story.</text><text x="18" y="440" font-size="12" fill="#a3a29c" dominant-baseline="central">Journal</text><rect x="122" y="424" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="440" font-size="12" fill="#6f6e69" dominant-baseline="central">What the PDA journal says</text><text x="18" y="481" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">START AND PLACE</text><text x="18" y="504" font-size="12" fill="#a3a29c" dominant-baseline="central">Starts when</text><rect x="122" y="488" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="504" font-size="12" fill="#ececea" dominant-baseline="central">Talk to a quest giver</text><path d="M364 502 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="542" font-size="12" fill="#a3a29c" dominant-baseline="central">Detail</text><rect x="122" y="526" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="542" font-size="12" fill="#ececea" dominant-baseline="central">Old Hryts, after dark</text><text x="18" y="580" font-size="12" fill="#a3a29c" dominant-baseline="central">Region</text><rect x="122" y="564" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="580" font-size="12" fill="#ececea" dominant-baseline="central">Zalissya</text><path d="M364 578 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="618" font-size="12" fill="#a3a29c" dominant-baseline="central">Place</text><rect x="122" y="602" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="618" font-size="12" fill="#ececea" dominant-baseline="central">The campfire behind the church</text><text x="18" y="659" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">CHARACTERS</text><text x="18" y="678" font-size="12" fill="#a3a29c" font-weight="400">Set the pickers, then type the name and press Enter.</text><text x="18" y="699" font-size="12" dominant-baseline="central"><tspan fill="#e8772e">•</tspan><tspan fill="#ececea" dx="8">Old Hryts (Quest giver, Loners, Stay)</tspan></text><rect x="310" y="684" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="698" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><text x="18" y="731" font-size="12" dominant-baseline="central"><tspan fill="#e8772e">•</tspan><tspan fill="#ececea" dx="8">Bandits ×3 (Enemy, Bandits, Patrol)</tspan></text><rect x="310" y="716" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="730" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><text x="18" y="764" font-size="12" fill="#a3a29c" dominant-baseline="central">Role</text><rect x="122" y="748" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="764" font-size="12" fill="#ececea" dominant-baseline="central">Quest giver</text><path d="M364 762 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="802" font-size="12" fill="#a3a29c" dominant-baseline="central">Faction</text><rect x="122" y="786" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="802" font-size="12" fill="#ececea" dominant-baseline="central">Loners</text><path d="M364 800 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="840" font-size="12" fill="#a3a29c" dominant-baseline="central">Behavior</text><rect x="122" y="824" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="840" font-size="12" fill="#ececea" dominant-baseline="central">Stay (idle)</text><path d="M364 838 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="878" font-size="12" fill="#a3a29c" dominant-baseline="central">How many</text><rect x="122" y="862" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="878" font-size="12" fill="#ececea" dominant-baseline="central">1</text><text x="18" y="916" font-size="12" fill="#a3a29c" dominant-baseline="central">Vanilla SID</text><rect x="122" y="900" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="916" font-size="12" fill="#6f6e69" dominant-baseline="central">Empty for a new character</text><text x="18" y="954" font-size="12" fill="#a3a29c" dominant-baseline="central">Name</text><rect x="122" y="938" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="954" font-size="12" fill="#6f6e69" dominant-baseline="central">Add a character and press Enter</text><text x="18" y="995" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">STAGES</text><text x="18" y="1014" font-size="12" fill="#a3a29c" font-weight="400">Each objective in order (a Set Journal stage each).</text><text x="18" y="1035" font-size="12" fill="#ececea" dominant-baseline="central">1. <tspan fill="#e8772e">[Talk to]</tspan> Hear Hryts out <tspan fill="#a3a29c">(Quest Marker)</tspan></text><rect x="326" y="1020" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="1034" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↑</text><rect x="356" y="1020" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="369.0" y="1034" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↓</text><text x="18" y="1067" font-size="12" fill="#ececea" dominant-baseline="central">2. <tspan fill="#e8772e">[Collect]</tspan> Bring firewood <tspan fill="#a3a29c">(Zone marker)</tspan></text><rect x="326" y="1052" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="1066" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↑</text><rect x="356" y="1052" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="369.0" y="1066" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↓</text><text x="18" y="1099" font-size="12" fill="#ececea" dominant-baseline="central">3. <tspan fill="#e8772e">[Defend]</tspan> Hold the camp till dawn <tspan fill="#a3a29c">(optional)</tspan></text><rect x="326" y="1084" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="1098" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↑</text><rect x="356" y="1084" width="26" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="369.0" y="1098" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">↓</text><text x="18" y="1132" font-size="12" fill="#a3a29c" dominant-baseline="central">Kind</text><rect x="122" y="1116" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="1132" font-size="12" fill="#ececea" dominant-baseline="central">Go to</text><path d="M364 1130 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="1170" font-size="12" fill="#a3a29c" dominant-baseline="central">Marker</text><rect x="122" y="1154" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="1170" font-size="12" fill="#ececea" dominant-baseline="central">Marker (fixed point)</text><path d="M364 1168 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="1208" font-size="12" fill="#a3a29c" dominant-baseline="central">Stage is</text><rect x="122" y="1192" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="1208" font-size="12" fill="#ececea" dominant-baseline="central">Required</text><path d="M364 1206 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="1246" font-size="12" fill="#a3a29c" dominant-baseline="central">Objective</text><rect x="122" y="1230" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="1246" font-size="12" fill="#6f6e69" dominant-baseline="central">Find the courier in the tunnels</text><text x="18" y="1287" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">REWARDS</text><text x="18" y="1306" font-size="12" fill="#a3a29c" font-weight="400">What the player gets on success.</text><text x="18" y="1328" font-size="13" fill="#a3a29c" dominant-baseline="central">-</text><text x="36" y="1328" font-size="13" fill="#ececea" dominant-baseline="central">Hryts' old harmonica</text><rect x="310" y="1314" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="1328" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="1346" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="1362" font-size="13" fill="#6f6e69" dominant-baseline="central">3000 coupons and a Saiga</text><rect x="18" y="1384" width="130" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="83.0" y="1398" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Money (coupons)</text><rect x="154" y="1384" width="194" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="251.0" y="1398" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Reputation with a faction</text><rect x="18" y="1418" width="123" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="79.5" y="1432" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>A stash marker</text><text x="18" y="1467" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">CHOICES AND BRANCHES</text><text x="18" y="1486" font-size="12" fill="#a3a29c" font-weight="400">Where the player decides, and what each way leads to.</text><rect x="18" y="1492" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="1508" font-size="13" fill="#6f6e69" dominant-baseline="central">Return the PDA or sell it to the bandits</text><rect x="18" y="1530" width="187" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="111.5" y="1544" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Spare or kill the target</text><rect x="18" y="1564" width="219" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="127.5" y="1578" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Peaceful route through dialog</text><text x="18" y="1613" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">RULES AND FAILURE</text><text x="18" y="1636" font-size="13" fill="#a3a29c" dominant-baseline="central">-</text><text x="36" y="1636" font-size="13" fill="#ececea" dominant-baseline="central">Fails if the quest giver dies</text><rect x="310" y="1622" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="1636" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="1654" width="149" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="92.5" y="1668" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Protect quest NPCs</text><rect x="173" y="1654" width="181" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="263.5" y="1668" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Works in existing saves</text><text x="18" y="1704" font-size="12" fill="#a3a29c" font-weight="400">Dialogs, items, world changes, audio, outcome, languages</text><text x="18" y="1722" font-size="12" fill="#a3a29c" font-weight="400">and notes follow the same way.</text><text x="18" y="1748" font-size="12" fill="#a3a29c" font-weight="400">Ready to send.</text><rect x="18" y="1754" width="116" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="76.0" y="1768" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Send to Claude</text><rect x="140" y="1754" width="50" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="165.0" y="1768" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Save</text><rect x="196" y="1754" width="83" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="237.5" y="1768" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">New quest</text></svg>