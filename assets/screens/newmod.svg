<svg xmlns="http://www.w3.org/2000/svg" width="400" height="966" viewBox="0 0 400 966" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The New mod form: release candidate naming, the mod's name, main idea, features and details to check, a Send to Claude button, and Clawd plotting a route on his PDA</title><rect width="400" height="966" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="399" height="965" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="27" font-size="13" font-weight="600" fill="#ececea">New mod</text><path d="M373 18 l8 8 M381 18 l-8 8" stroke="#6f6e69" stroke-width="1.4"/><text x="18" y="61" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">NEW MOD BRIEF</text><text x="18" y="80" font-size="12" fill="#a3a29c" font-weight="400">Write down what you know. Claude asks about the</text><text x="18" y="98" font-size="12" fill="#a3a29c" font-weight="400">rest and keeps this plan in the mod's PLAN.md.</text><text x="18" y="129" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">RELEASE CANDIDATE FILES</text><text x="18" y="148" font-size="12" fill="#a3a29c" font-weight="400">After every packaging the files are copied into this</text><text x="18" y="166" font-size="12" fill="#a3a29c" font-weight="400">folder of the mod, renamed for the load order you want.</text><text x="18" y="188" font-size="12" fill="#a3a29c" dominant-baseline="central">Folder</text><rect x="122" y="172" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="188" font-size="12" fill="#ececea" dominant-baseline="central">ReleaseCandidate</text><text x="18" y="226" font-size="12" fill="#a3a29c" dominant-baseline="central">Override files</text><rect x="122" y="210" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="226" font-size="12" fill="#ececea" dominant-baseline="central">zzzz_{mod}_P</text><text x="18" y="264" font-size="12" fill="#a3a29c" dominant-baseline="central">New content files</text><rect x="122" y="248" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="264" font-size="12" fill="#ececea" dominant-baseline="central">Keep the kit's name</text><path d="M364 262 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="302" font-size="12" fill="#a3a29c" dominant-baseline="central">Copy</text><rect x="122" y="286" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="302" font-size="12" fill="#ececea" dominant-baseline="central">Automatically after each packaging</text><path d="M364 300 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><text x="18" y="335" font-size="11" fill="#a3a29c" font-weight="400">ReleaseCandidate/zzzz_ImmersiveCampfires_P.pak · .utoc · .ucas</text><text x="18" y="351" font-size="11" fill="#a3a29c" font-weight="400">ReleaseCandidate/ImmersiveCampfiresStalker2-Windows-NewContent.pak</text><text x="18" y="367" font-size="11" fill="#a3a29c" font-weight="400">zzzz_ mounts after mods named zzz_ at the same priority.</text><text x="18" y="393" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">NAME</text><text x="18" y="412" font-size="12" fill="#a3a29c" font-weight="400">What players will see on Nexus.</text><rect x="18" y="418" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="434" font-size="13" fill="#ececea" dominant-baseline="central">Immersive Campfires</text><text x="18" y="475" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MAIN IDEA</text><text x="18" y="494" font-size="12" fill="#a3a29c" font-weight="400">One or two sentences: what changes for the player.</text><rect x="18" y="500" width="364" height="52" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="516" font-size="13" fill="#ececea" dominant-baseline="central">Sit down at any campfire: the camera lowers, time</text><text x="29" y="536" font-size="13" fill="#ececea" dominant-baseline="central">passes faster and you heal slowly.</text><text x="18" y="577" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">FEATURES</text><text x="18" y="596" font-size="12" fill="#a3a29c" font-weight="400">One at a time. They become the checklist in the panel.</text><text x="18" y="618" font-size="13" fill="#a3a29c" dominant-baseline="central">1.</text><text x="36" y="618" font-size="13" fill="#ececea" dominant-baseline="central">Sit with a key near a fire</text><rect x="310" y="604" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="618" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><text x="18" y="652" font-size="13" fill="#a3a29c" dominant-baseline="central">2.</text><text x="36" y="652" font-size="13" fill="#ececea" dominant-baseline="central">Camera lowers while seated</text><rect x="310" y="638" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="652" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="670" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="686" font-size="13" fill="#6f6e69" dominant-baseline="central">Add a feature and press Enter</text><text x="18" y="727" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">DETAILS TO CHECK</text><text x="18" y="746" font-size="12" fill="#a3a29c" font-weight="400">Questions to settle and cases to test.</text><text x="18" y="768" font-size="13" fill="#a3a29c" dominant-baseline="central">-</text><text x="36" y="768" font-size="13" fill="#ececea" dominant-baseline="central">Keyboard and gamepad</text><rect x="310" y="754" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="768" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="786" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="802" font-size="13" fill="#6f6e69" dominant-baseline="central">Add a detail and press Enter</text><rect x="18" y="824" width="115" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="75.5" y="838" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Rebound keys</text><rect x="139" y="824" width="227" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="252.5" y="838" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Survives save, load and death</text><rect x="18" y="858" width="260" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="148.0" y="872" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Works alongside other popular mods</text><text x="18" y="914" font-size="12" fill="#a3a29c" font-weight="400">Ready to send.</text><rect x="18" y="920" width="116" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="76.0" y="934" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Send to Claude</text><rect x="142" y="920" width="90" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="187.0" y="934" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Start over</text><g transform="translate(292 44) scale(2)" shape-rendering="crispEdges"><rect x="6" y="0" width="16" height="1" fill="#d97757"/><rect x="6" y="1" width="1" height="1" fill="#d97757"/><rect x="7" y="1" width="6" height="1" fill="#5b5850"/><rect x="13" y="1" width="2" height="1" fill="#2b2a27"/><rect x="15" y="1" width="6" height="1" fill="#5b5850"/><rect x="21" y="1" width="1" height="1" fill="#d97757"/><rect x="6" y="2" width="1" height="1" fill="#d97757"/><rect x="7" y="2" width="1" height="1" fill=