<svg xmlns="http://www.w3.org/2000/svg" width="400" height="702" viewBox="0 0 400 702" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The New mod form: the mod's name, main idea, features and details to check, a Send to Claude button, and Clawd plotting a route on his PDA</title><rect width="400" height="702" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="399" height="701" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="27" font-size="13" font-weight="600" fill="#ececea">New mod</text><path d="M373 18 l8 8 M381 18 l-8 8" stroke="#6f6e69" stroke-width="1.4"/><text x="18" y="61" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">NEW MOD BRIEF</text><text x="18" y="80" font-size="12" fill="#a3a29c" font-weight="400">Write down what you know. Claude asks about the</text><text x="18" y="98" font-size="12" fill="#a3a29c" font-weight="400">rest and keeps this plan in the mod's PLAN.md.</text><text x="18" y="129" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">NAME</text><text x="18" y="148" font-size="12" fill="#a3a29c" font-weight="400">What players will see on Nexus.</text><rect x="18" y="154" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="170" font-size="13" fill="#ececea" dominant-baseline="central">Immersive Campfires</text><text x="18" y="211" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MAIN IDEA</text><text x="18" y="230" font-size="12" fill="#a3a29c" font-weight="400">One or two sentences: what changes for the player.</text><rect x="18" y="236" width="364" height="52" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="252" font-size="13" fill="#ececea" dominant-baseline="central">Sit down at any campfire: the camera lowers, time</text><text x="29" y="272" font-size="13" fill="#ececea" dominant-baseline="central">passes faster and you heal slowly.</text><text x="18" y="313" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">FEATURES</text><text x="18" y="332" font-size="12" fill="#a3a29c" font-weight="400">One at a time. They become the checklist in the panel.</text><text x="18" y="354" font-size="13" fill="#a3a29c" dominant-baseline="central">1.</text><text x="36" y="354" font-size="13" fill="#ececea" dominant-baseline="central">Sit with a key near a fire</text><rect x="310" y="340" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="354" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><text x="18" y="388" font-size="13" fill="#a3a29c" dominant-baseline="central">2.</text><text x="36" y="388" font-size="13" fill="#ececea" dominant-baseline="central">Camera lowers while seated</text><rect x="310" y="374" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="388" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="406" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="422" font-size="13" fill="#6f6e69" dominant-baseline="central">Add a feature and press Enter</text><text x="18" y="463" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">DETAILS TO CHECK</text><text x="18" y="482" font-size="12" fill="#a3a29c" font-weight="400">Questions to settle and cases to test.</text><text x="18" y="504" font-size="13" fill="#a3a29c" dominant-baseline="central">-</text><text x="36" y="504" font-size="13" fill="#ececea" dominant-baseline="central">Keyboard and gamepad</text><rect x="310" y="490" width="72" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="346.0" y="504" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Remove</text><rect x="18" y="522" width="364" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="29" y="538" font-size="13" fill="#6f6e69" dominant-baseline="central">Add a detail and press Enter</text><rect x="18" y="560" width="115" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="75.5" y="574" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Rebound keys</text><rect x="139" y="560" width="227" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="252.5" y="574" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Survives save, load and death</text><rect x="18" y="594" width="260" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="148.0" y="608" font-size="12" fill="#a3a29c" text-anchor="middle" dominant-baseline="central"><tspan fill="#e8772e">+ </tspan>Works alongside other popular mods</text><text x="18" y="650" font-size="12" fill="#a3a29c" font-weight="400">Ready to send.</text><rect x="18" y="656" width="116" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="76.0" y="670" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Send to Claude</text><rect x="142" y="656" width="90" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="187.0" y="670" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Start over</text><g transform="translate(292 44) scale(2)" shape-rendering="crispEdges"><rect x="6" y="0" width="16" height="1" fill="#d97757"/><rect x="6" y="1" width="1" height="1" fill="#d97757"/><rect x="7" y="1" width="6" height="1" fill="#5b5850"/><rect x="13" y="1" width="2" height="1" fill="#2b2a27"/><rect x="15" y="1" width="6" height="1" fill="#5b5850"/><rect x="21" y="1" width="1" height="1" fill="#d97757"/><rect x="6" y="2" width="1" height="1" fill="#d97757"/><rect x="7" y="2" width="1" height="1" fill="#5b5850"/><rect x="8" y="2" width="1" height="1" fill="#faf9f5"/><rect x="9" y="2" width="3" height="1" fill="#d4dc6a"/><rect x="12"