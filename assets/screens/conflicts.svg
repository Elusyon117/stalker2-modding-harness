<svg xmlns="http://www.w3.org/2000/svg" width="400" height="717" viewBox="0 0 400 717" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>The Conflicts panel: a collection folder, the mods scanned with their mount order, and each conflict with its winner, the mods it beats and an Ask Claude button</title><rect width="400" height="717" rx="12" fill="#1f1e1d"/><rect x="0.5" y="0.5" width="399" height="716" rx="12" fill="none" stroke="#3d3c38"/><text x="18" y="27" font-size="13" font-weight="600" fill="#ececea">Mod conflicts</text><path d="M373 18 l8 8 M381 18 l-8 8" stroke="#6f6e69" stroke-width="1.4"/><text x="18" y="61" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MOD CONFLICTS</text><text x="18" y="80" font-size="12" fill="#a3a29c" font-weight="400">Per asset the last-mounted pak wins and nothing merges;</text><text x="18" y="98" font-size="12" fill="#a3a29c" font-weight="400">cfg patches clash only on the same field.</text><text x="18" y="120" font-size="12" fill="#a3a29c" dominant-baseline="central">Collection folder</text><rect x="122" y="104" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="120" font-size="12" fill="#ececea" dominant-baseline="central">D:/ST2ZKMods/Collections/Hardcore</text><text x="18" y="158" font-size="12" fill="#a3a29c" dominant-baseline="central">Show</text><rect x="122" y="142" width="260" height="32" rx="6" fill="#1f1e1d" stroke="#4a4944"/><text x="132" y="158" font-size="12" fill="#ececea" dominant-baseline="central">Every conflict</text><path d="M364 156 l4 4 l4 -4" fill="none" stroke="#a3a29c" stroke-width="1.5"/><rect x="18" y="180" width="90" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="63.0" y="194" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Scan again</text><text x="18" y="229" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">MODS SCANNED (14)</text><text x="18" y="248" font-size="12" fill="#a3a29c" font-weight="400">3 min ago · yours, installed, collection</text><text x="18" y="267" font-size="12"><tspan fill="#e8772e">ImmersiveCampfires (yours) · 103</tspan><tspan fill="#a3a29c" dx="10">BetterHud · 203</tspan></text><text x="18" y="285" font-size="12" fill="#a3a29c" font-weight="400">GrittyCamps · 103   WeaponOverhaul · 103   and 10 more</text><text x="18" y="310" font-size="11" fill="#e8772e" font-weight="600" letter-spacing="0.8">CONFLICTS (4)</text><text x="18" y="329" font-size="12" fill="#a3a29c" font-weight="400">1 risky · 1 check · 2 one wins</text><text x="18" y="348" font-size="13"><tspan fill="#f87171">✗</tspan><tspan fill="#a3a29c" dx="8">asset</tspan><tspan fill="#ececea" font-weight="600" dx="8">…/Player/AnimBP_Player</tspan><tspan fill="#e8772e" font-size="12" dx="8">yours</tspan></text><text x="34" y="369" font-size="12" dominant-baseline="central"><tspan fill="#4ade80">wins: GrittyCamps</tspan><tspan fill="#a3a29c" dx="8">over ImmersiveCampfires</tspan></text><rect x="296" y="355" width="86" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="369" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Ask Claude</text><text x="34" y="399" font-size="12" fill="#a3a29c" font-weight="400">Heavily shared asset: merge, or make one optional.</text><text x="18" y="426" font-size="13"><tspan fill="#c2410c">!</tspan><tspan fill="#a3a29c" dx="8">asset</tspan><tspan fill="#ececea" font-weight="600" dx="8">…/UI/W_GameHUD</tspan></text><text x="34" y="447" font-size="12" dominant-baseline="central"><tspan fill="#4ade80">wins: BetterHud</tspan><tspan fill="#a3a29c" dx="8">over GrittyCamps</tspan></text><rect x="296" y="433" width="86" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="447" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Ask Claude</text><text x="34" y="477" font-size="12" fill="#a3a29c" font-weight="400">Same mount order: the file name decides.</text><text x="18" y="504" font-size="13"><tspan fill="#e8772e">!</tspan><tspan fill="#a3a29c" dx="8">cfg</tspan><tspan fill="#ececea" font-weight="600" dx="8">corevariables.cfg › CampfireHealRate</tspan><tspan fill="#e8772e" font-size="12" dx="8">yours</tspan></text><text x="34" y="525" font-size="12" dominant-baseline="central"><tspan fill="#4ade80">wins: ImmersiveCampfires</tspan><tspan fill="#a3a29c" dx="8">over GrittyCamps</tspan></text><rect x="296" y="511" width="86" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="525" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Ask Claude</text><text x="34" y="555" font-size="12" fill="#a3a29c" font-weight="400">Both patch this field; yours loads later and wins.</text><text x="18" y="582" font-size="13"><tspan fill="#e8772e">!</tspan><tspan fill="#a3a29c" dx="8">cfg</tspan><tspan fill="#ececea" font-weight="600" dx="8">weapon…prototypes.cfg › GunAK74_ST › Recoil</tspan></text><text x="34" y="603" font-size="12" dominant-baseline="central"><tspan fill="#4ade80">wins: WeaponOverhaul</tspan><tspan fill="#a3a29c" dx="8">over Hardcore</tspan></text><rect x="296" y="589" width="86" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="339.0" y="603" font-size="12" fill="#a3a29c" font-weight="400" text-anchor="middle" dominant-baseline="central">Ask Claude</text><text x="34" y="633" font-size="12" fill="#a3a29c" font-weight="400">Both patch this field; WeaponOverhaul loads later.</text><rect x="18" y="647" width="208" height="28" rx="6" fill="#262624" stroke="#4a4944"/><text x="122.0" y="661" font-size="12" fill="#e8772e" font-weight="600" text-anchor="middle" dominant-baseline="central">Ask Claude about all of them</text><text x="18" y="693" font-size="12" fill="#a3a29c" font-weight="400">37 more files are shipped identically by several mods.</text>